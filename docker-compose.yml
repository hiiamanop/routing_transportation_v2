services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      # 127.0.0.1 saja -- server produksi ini melayani banyak app lain lewat
      # nginx di host, cuma nginx yang perlu menjangkau container ini.
      - "127.0.0.1:5001:5001"
    volumes:
      # Seluruh dataset/ HARUS di luar image, bukan cuma survey/: tanpa mount
      # ini setiap `--build` menghapus seluruh observasi survei DAN hasil
      # tagging GPS halte (network_data_complete.json,
      # network_data_correct_bidirectional.json) beserta file backup-nya.
      - ./dataset:/app/dataset

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Wajib sbg BUILD arg (bukan cuma environment runtime) krn rewrites()
        # Next.js di-bake saat `npm run build`, dibaca ulang saat `next start`.
        API_INTERNAL_URL: http://api:5001
    ports:
      # Port 3000 dipakai app lain di server ini (meetsin-leads-frontend) --
      # 3030 dipilih krn bebas, dan 127.0.0.1 krn cuma nginx yg perlu akses.
      - "127.0.0.1:3030:3000"
    depends_on:
      - api
